function clkStr(){const u=(gt/480)%1,h=u<.75?6+u/.75*14:20+(u-.75)/.25*10,H=Math.floor(h)%24,M=Math.floor(h%1*12)*5;return (H<10?'0':'')+H+':'+(M<10?'0':'')+M}
function clockHud(y){const t=clkStr(),night=dayD()>.5;ctx.font=F(8);const w=ctx.measureText(t).width,x=VW-6-w-10;
 if(night){p('#dfe8ff',x,y+1,6,6);p('#dfe8ff',x+1,y,4,8);p('#2a2450',x+3,y+1,4,5);p('#2a2450',x+4,y,2,7)}
 else{p('#ffd83a',x+1,y+1,5,5);p('#ffd83a',x,y+2,7,3);p('#ffd83a',x+2,y,3,7);p('#fff3a0',x+2,y+2,2,2)}
 txt(t,VW-6,y,night?'#bcd0ff':'#ffe9a8','right')}
function toggleHl(){if(state!=='play'||cin||dlg||mini||tut||ask||showMap||showLog||showSet||ins())return;
 if(!Q.cartOn){msg('Reflektory są w traktorku (Y)');return}
 hl=hl?0:1;msg(hl?'Reflektory włączone':'Reflektory wyłączone');beep(hl?780:420,.07)}

let nc=null,nx=null;
const LRGB=['255,64,64','255,216,58','64,208,255','106,255,106'],XTC=['#ff4040','#ffd83a','#40d0ff','#ffffff'],XTR=['255,64,64','255,216,58','64,208,255','255,255,255'];
function nightPass(){
 const D=dayD(),hon=hl&&Q.cartOn;
 if(D>0&&D<1){ctx.fillStyle='rgba(255,120,60,'+(.16*Math.sin(D*Math.PI)).toFixed(3)+')';ctx.fillRect(0,0,VW,VH)}
 if(D<.02)return;
 if(!nc){nc=document.createElement('canvas');nc.width=VW;nc.height=VH;nx=nc.getContext('2d')}
 nx.globalCompositeOperation='source-over';nx.clearRect(0,0,VW,VH);
 nx.fillStyle='rgba(5,9,38,'+(.8*D).toFixed(3)+')';nx.fillRect(0,0,VW,VH);
 nx.globalCompositeOperation='destination-out';
 const cut=(x,y,r,a)=>{const g=nx.createRadialGradient(x,y,r*.1,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+Math.min(1,a*D).toFixed(3)+')');g.addColorStop(1,'rgba(0,0,0,0)');nx.fillStyle=g;nx.fillRect(x-r,y-r,r*2,r*2)};
 const warm=[],dots=[];
 const xa=Math.max(0,(cam.x>>4)-3),xb=Math.min(MW-1,((cam.x+VW)>>4)+3),ya=Math.max(0,(cam.y>>4)-3),yb=Math.min(MH-1,((cam.y+VH)>>4)+3);
 for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){
  const mt=map[y][x],sx=x*16-cam.x,sy=y*16-cam.y;
  if(mt==='I'||mt==='L'){cut(sx+8,sy+5,54,.95);warm.push([sx+8,sy+5,34,.35])}
  else if(mt==='n'){const f=.85+.15*Math.sin(T/90+x);cut(sx+8,sy+10,62*f,.95);warm.push([sx+8,sy+10,40,.4*f,'255,150,50'])}
  else if(mt==='S'){cut(sx+8,sy+4,34,.8)}
  else if(mt==='W'){if(!(hash(x,y)%16&1)){cut(sx+8,sy+8,26,.8);dots.push([sx+3,sy+3,10,9,'rgba(255,205,110,.55)'])}}
  else if(mt==='O'){cut(sx+8,sy+6,26,.7)}
  else if('ABJK'.includes(mt)){if(hash(x,y)%5<3)cut(sx+8,sy+8,20,.5)}
  else if(mt==='M'){cut(sx+8,sy+8,22,.75);for(let i=0;i<4;i++){const c=(i+(T/350|0)+x)&3;dots.push([sx+1+i*4,sy+8,2,1,LC[c],LRGB[c]])}}
  else if(mt==='X'){cut(sx+8,sy+8,30,.8);for(let i=0;i<5;i++){const c=(i+(T/300|0))%4;dots.push([sx+4+(i*5)%9,sy+5+i*2,2,2,XTC[c],XTR[c]])}}
  else if(mt==='T'){if(hash(x,y)%4===0&&x>35&&(y<34||(y>54&&y<66))){cut(sx+8,sy+8,28,.7);for(let i=0;i<5;i++){const r=1+(hash(x+i,y*3+i)%9),w=2+r,xx=8-(w>>1)+(hash(x*5+i,y)%w);if(((T/380|0)+i+x)%3){const c=(i+x)&3;dots.push([sx+xx,sy+1+r,2,1,LC[c],LRGB[c]])}}}}
  else if(mt==='.'){if(!SVA[y*MW+x]&&hash(x,y)%7===0&&x>14&&y>3&&nb(x,y,'pQ')){cut(sx+8,sy+3,52,.95);warm.push([sx+8,sy+3,30,.3])}}
 }
 // wielka choinka na rynku i girlandy
 {const X=78*16+8-cam.x,Y=17*16-cam.y;
  if(X>-120&&X<VW+120&&Y>-40&&Y<VH+150){cut(X,Y-46,96,.9);warm.push([X,Y-46,60,.16,'255,200,120']);
   for(let i=0;i<30;i++){const r=hash(i,3)%72,w=4+(r*.8|0),lx=hash(i,5)%w-(w>>1),c=(i+(T/(Q.fin?140:480)|0))%4;dots.push([X+lx,Y-92+r,2,2,XTC[c],XTR[c]])}}
  for(const[a,b]of[[67,10],[89,10],[67,22],[89,22]])cut(a*16+8-cam.x,b*16+4-cam.y,70,.6)}
 // Peter ma przy sobie małą latarenkę
 cut(pl.x-cam.x,pl.y-cam.y-6,40,.6);
 // reflektory traktora
 let ox=0,oy=0,ca=0,sa=0;
 if(hon){const a=pl.th!==undefined?pl.th:(DA[pl.dir]||0);ca=Math.cos(a);sa=Math.sin(a);ox=pl.x-cam.x+ca*10;oy=pl.y-cam.y-5+sa*10;const Ln=150;
  nx.save();nx.translate(ox,oy);nx.rotate(a);const g=nx.createLinearGradient(0,0,Ln,0);g.addColorStop(0,'rgba(0,0,0,'+(.98*D).toFixed(3)+')');g.addColorStop(1,'rgba(0,0,0,0)');
  nx.fillStyle=g;nx.beginPath();nx.moveTo(0,-3);nx.lineTo(Ln,-Ln*.42);nx.lineTo(Ln,Ln*.42);nx.lineTo(0,3);nx.closePath();nx.fill();nx.restore();
  warm.push([ox+ca*45,oy+sa*45,50,.18,'255,240,170'])}
 ctx.imageSmoothingEnabled=true;ctx.drawImage(nc,0,0);ctx.imageSmoothingEnabled=false;
 for(const w of warm)glow(w[0],w[1],w[2],w[4]||'255,215,120',w[3]);
 for(const d of dots){p(d[4],d[0],d[1],d[2],d[3]);if(d[5])glow(d[0]+1,d[1],7,d[5],.5)}
 if(hon){const fx=pl.x-cam.x+ca*14,fy=pl.y-cam.y-5+sa*14;p('#fffbd0',(fx-sa*5-1)|0,(fy+ca*5-1)|0,2,2);p('#fffbd0',(fx+sa*5-1)|0,(fy-ca*5-1)|0,2,2)}
}
addEventListener('keydown',e=>{if(state==='name')return;const key=e.key.toLowerCase(),a=KM[key];k.run=e.shiftKey?1:0;
 if(cin&&!['e',' ','enter','escape'].includes(key)){e.preventDefault();return}
 if(state==='title'&&(a==='up'||a==='down')){msel^=1;beep(520,.05)}
 if(a){k[a]=1;e.preventDefault();return}
 if(key==='e'||key===' '||key==='enter'){e.preventDefault();if(!e.repeat)press()}
 if(key==='m')toggleMap();if(key==='i')cycleMsz();if(key==='o')toggleSet();if(key==='escape'){if(cin&&cin.t>.5)endCin();showSet=false;if(mini)mini=null;if(tut){tut=null;intro()}}if(key==='f')dig();if(key==='y')kukKey();if(key==='l')toggleHl();if(key==='j')toggleLog();if(key==='n'){mute=!mute;saveSet()}});
addEventListener('keyup',e=>{k.run=e.shiftKey?1:0;const a=KM[e.key.toLowerCase()];if(a)k[a]=0});
addEventListener('blur',()=>{for(const a in k)k[a]=0});
addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*VW,my=(e.clientY-r.top)/r.height*VH,In=q=>q&&mx>=q[0]&&mx<=q[0]+q[2]&&my>=q[1]&&my<=q[1]+q[3];
 if(state==='name'){if(In(NB))confirmName();return}
 if(state==='title'){const i=AMB.findIndex(In);if(i<0)return;msel=i}
 if(showSet){const i=SETR.findIndex(In);if(i<0){showSet=false;return}setSel=i;setAct(1,1);return}
 if(ask){const i=AB.findIndex(In);if(i<0)return;ask.s=i}else if(dlg&&dlg.rp){if(!In(dlg.rp.b))return;dlg.rp.s=clamp((my-dlg.rp.b[1]-4)/12|0,0,dlg.rp.o.length-1)}press()});
document.querySelectorAll('#pad b').forEach(b=>{const a=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}if(a in k)k[a]=1;else if(a==='act')press();else if(a==='map')toggleMap();else if(a==='dig')dig();else if(a==='kuk')kukKey();else if(a==='log')toggleLog();else if(a==='set')toggleSet();else if(a==='msz')cycleMsz();else if(a==='hl')toggleHl()});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(a in k)k[a]=0}))});

const jy=document.getElementById('joy'),kn=document.getElementById('kn');let jid=null;
const jm=e=>{const q=jy.getBoundingClientRect(),R=q.width/2;let x=(e.clientX-q.left-R)/R,y=(e.clientY-q.top-R)/R;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}const dz=l<.18;
 k.left=!dz&&x<0?-x:0;k.right=!dz&&x>0?x:0;k.up=!dz&&y<0?-y:0;k.down=!dz&&y>0?y:0;kn.style.transform='translate('+x*R*.6+'px,'+y*R*.6+'px)'};
jy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;jy.setPointerCapture(jid);jm(e)});
jy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
['pointerup','pointercancel'].forEach(v=>jy.addEventListener(v,()=>{jid=null;k.left=k.right=k.up=k.down=0;kn.style.transform=''}));
})();
